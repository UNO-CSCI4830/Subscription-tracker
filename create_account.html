<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account | SubTracked</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/x-icon" href="images/subtracked_logo_small.PNG">
  <link rel="stylesheet" href="css/create_account.css">
</head>
<body>

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <img src="images/subtracked_logo.PNG" alt="Logo" style="width: 250px; height: auto; border-radius: 10px;">
  </div>

  <div class="card">
    <div class="hd">
      <h1>Join SubTracked</h1>
      <p>Your Expenses: Tracked.</p>
    </div>

    <div class="bd">
      <form id="signupForm">
        <div class="row">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Jane" required>

          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="field">
          <label>Email Address</label>
          <input type="email" placeholder="jane@example.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" placeholder="At least 8 characters" minlength="8" required>
        </div>

        <label class="terms">
          <input type="checkbox" required>
          <span>I agree to the Terms of Service and Privacy Policy.</span>
        </label>

        <button type="submit">Create Account</button>
      </form>

      <div class="footer-txt">
        Already have an account? <a href="login_screen.html">Sign In</a>
      </div>
    </div>
  </div>
  <script src="js/create_account.js"></script>
</body>
</html>

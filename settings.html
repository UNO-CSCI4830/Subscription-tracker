<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reminder Settings | SubTracked</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/x-icon" href="images/subtracked_logo_small.PNG">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <img src="images/subtracked_logo.PNG" alt="Logo" style="width: 250px; height: auto; border-radius: 10px;">
  </div>

  <div class="card">
    <div class="hd">
      <h1>Reminder Settings</h1>
    </div>

    <div class="bd">
      <form id="settingsForm">
        <div class="field">
          <label>Reminder Email</label>
          <input type="email" id="reminderEmail" placeholder="name@company.com" required>
        </div>

        <div class="field">
          <label>Days Before Renewal</label>
          <select id="daysBefore" required>
            <option value="1">1 day before</option>
            <option value="3">3 days before</option>
            <option value="7">7 days before</option>
          </select>
        </div>

        <label class="terms">
          <input type="checkbox" id="reminderEnabled">
          <span>Enable email reminders</span>
        </label>

        <button type="submit">Save Settings</button>
      </form>

      <div id="statusText" class="footer-txt"></div>

      <div class="footer-txt">
        <a href="index.html">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/settings.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home | SubTracked</title>
  <link rel="icon" type="image/x-icon" href="subtracked_logo_small.PNG">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f1220;color:#f2f3f8}
    .wrap{max-width:1050px;margin:24px auto;padding:0 14px}
    h1{margin:0;font-size:22px}
    .subtxt{margin:6px 0 14px;color:#b9bdd0;font-size:13px}

    .tabs{display:none;gap:10px;margin-bottom:12px}
    .tab{
      flex:1;padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);
      background:transparent;color:#b9bdd0;cursor:pointer;font-weight:700
    }
    .tab.active{background:#2b67ff;border-color:#2b67ff;color:#fff}

    .grid{display:grid;grid-template-columns:360px 1fr;gap:14px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#141830;overflow:hidden}
    .hd{
      padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.10);background:#12162a
    }
    .hd h2{margin:0;font-size:14px}
    .bd{padding:14px}

    label{display:block;font-size:12px;color:#b9bdd0;margin:0 0 6px}
    input,select,textarea{
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      background: #0f1327;
      color: #f2f3f8;
      outline: none;
      box-sizing: border-box; 
      font-size: 13px;
    }
    textarea{min-height:70px;resize:vertical}

    .row{display:flex;gap:10px}
    .row>*{flex:1}

    .btnrow{display:flex;gap:10px;margin-top:12px}
    button{
      padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      background:#2b67ff;color:#fff;cursor:pointer;font-weight:700;font-size:13px
    }
    button.secondary{background:transparent;color:#f2f3f8}
    button.small{padding:7px 10px;font-size:12px;background:#1a1f39}
    button.danger{background:#ff476a;border-color:#ff476a}

    .hint{margin-top:10px;font-size:12px;color:#b9bdd0;line-height:1.35}

    .controls{
      display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.10);
      background:#12162a;flex-wrap:wrap
    }
    .controls input{flex:1;min-width:220px}

    .summary{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10)
    }
    .box{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;background:#10142b}
    .box .k{font-size:12px;color:#b9bdd0;margin-bottom:6px}
    .box .v{font-size:18px;font-weight:800}
    .box .s{font-size:12px;color:#b9bdd0;margin-top:4px}

    .list{padding:12px 14px 14px}
    .empty{
      padding:14px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;
      color:#b9bdd0;background:#10142b
    }

    .item{
      border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;margin-top:10px;
      background:#10142b;position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:10px
    }
    .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:#26d3b6}
    .soon .bar{background:#ff476a}
    .mid  .bar{background:#f5b942}
    .good .bar{background:#26d3b6}

    .left{display:flex;gap:10px;min-width:0;align-items:flex-start}
    .logo{
      width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
      background:#141830;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden
    }
    .logo img{width:18px;height:18px}
    .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
    .meta{margin-top:5px;font-size:12px;color:#b9bdd0;display:flex;flex-wrap:wrap;gap:8px}
    .tag{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 8px;background:#141830}
    .note{margin-top:6px;font-size:12px;color:#b9bdd0;line-height:1.3;max-width:560px}
    .right{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .price{font-weight:900}

    .form-grid {
      display: grid;
      /* Fixed 2-column layout with equal width */
      grid-template-columns: 1fr 1fr; 
      gap: 15px 10px; /* More vertical gap for labels */
    }

    /* Ensure the label and input stay stacked correctly */
    .form-grid > div {
      display: flex;
      flex-direction: column;
      min-width: 0; /* Prevents flex children from overflowing */
    }

    /* Ensure the label and input stay stacked correctly */
    .form-grid > div {
      display: flex;
      flex-direction: column;
      min-width: 0; /* Prevents flex children from overflowing */
    }

    /*rearranged the topbar and added the user login/logout section */
    .topbar{display: flex; justify-content: space-between; align-items: center;}
    .brand_area{display: flex; flex-direction: column;}
    .brand_row{display: flex; align-items: center; gap: 10px;}
    .brand_row h1{margin: 0; position: relative; top: 1px; font-size: 28px; left: 10px;}
    .main_logo{width: 42px; height: 42px; object-fit: cover; border-radius: 8px; display: block; flex-shrink: 0;}
    .user_area{display: flex; align-items: center; gap: 10px; margin-left: auto;}
    .current_user_text{color: #ece8e9; font-size: 13px; white-space: nowrap;}

  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand_area">
        <div class="brand_row">
          <img src="subtracked_logo_small.PNG" alt="Logo" class="main_logo">
          <h1>SubTracked</h1>
        </div>
        <div class="subtxt"></div>
      </div>

      <div class="user_area">
        <span id="currentUserText" class="current_user_text"></span>
        <button id="logoutBtn" class="small" type="button">Logout</button>
        <button id="loginBtn" class="small" type="button">Login</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="add">Add</button>
      <button class="tab" data-tab="list">List</button>
    </div>

    <div class="grid">
      <div class="card" id="addPanel">
        <div class="hd">
          <h2>Add subscription</h2>
        </div>

        <div class="bd">
          <form id="form">
            <div class="form-grid">
              <div>
                <label>Service</label>
                <input id="nameInput" placeholder="Spotify, Canva, Xbox..." required>
              </div>
              <div>
                <label>Website (logo)</label>
                <input id="siteInput" placeholder="spotify.com">
              </div>
              <div>
                <label>Price</label>
                <input id="priceInput" type="number" step="0.01" min="0" placeholder="9.99" required>
              </div>
              <div>
                <label>Cycle</label>
                <select id="cycleInput">
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                  <option value="weekly">Weekly</option>
                </select>
              </div>
              <div>
                <label>Next renewal</label>
                <input id="dateInput" type="date" required>
              </div>
              <div>
                <label>Category</label>
                <select id="catInput">
                  <option>Streaming</option>
                  <option>Music</option>
                  <option>Cloud</option>
                  <option>Gaming</option>
                  <option>Software</option>
                  <option>Fitness</option>
                  <option>Utilities</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div style="margin-top:10px">
              <label>Notes</label>
              <textarea id="notesInput" placeholder="shared account, student plan, cancel after semester..."></textarea>
            </div>

            <div class="btnrow">
              <button id="addBtn" type="submit">Add</button>
              <button class="secondary" id="resetBtn" type="button">Clear</button>
            </div>

            <div class="hint">
              Color is based on days left: 0–7 soon, 8–30 mid, 31+ long.
            </div>
          </form>
        </div>
      </div>

      <div class="card" id="listPanel">
        <div class="controls">
          <input id="searchInput" placeholder="Search...">
          <select id="sortInput">
            <option value="soonest">Due (soonest)</option>
            <option value="latest">Due (latest)</option>
            <option value="hi">Price (high)</option>
            <option value="lo">Price (low)</option>
            <option value="az">Name (A–Z)</option>
            <option value="za">Name (Z–A)</option>
          </select>
          <select id="filterInput">
            <option value="all">All</option>
            <option value="soon">Due soon</option>
            <option value="mid">Mid</option>
            <option value="long">Long-term</option>
          </select>
        </div>

        <div class="summary">
          <div class="box">
            <div class="k">Monthly total (estimated)</div>
            <div class="v" id="monthlyTotal">$0.00</div>
            <div class="s" id="countText">0 subscriptions</div>
          </div>
          <div class="box">
            <div class="k">Next renewal</div>
            <div class="v" id="nextWhen">—</div>
            <div class="s" id="nextWhat">—</div>
          </div>
        </div>

        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

<script>
  const _supabaseUrl = 'https://lnvmocbxmdfkaxrxmpqn.supabase.co';
  const _supabaseKey = 'sb_publishable_gVZEpmVuhZBt-V8NSaibYw_zaQPsmOb';
  const supabaseClient = supabase.createClient(_supabaseUrl, _supabaseKey);
  const GUEST_STORAGE_KEY = "subtracked_guest_subscriptions";
  
  let subs = [];
  let editId = null;
  let currentUser = null;

  const $ = (id) => document.getElementById(id);

  // UI Elements
  const formEl = $("form"), nameInput = $("nameInput"), siteInput = $("siteInput");
  const priceInput = $("priceInput"), cycleInput = $("cycleInput"), dateInput = $("dateInput");
  const catInput = $("catInput"), notesInput = $("notesInput"), addBtn = $("addBtn"), resetBtn = $("resetBtn");
  const searchInput = $("searchInput"), sortInput = $("sortInput"), filterInput = $("filterInput");
  const listEl = $("list"), monthlyTotal = $("monthlyTotal"), countText = $("countText");
  const nextWhen = $("nextWhen"), nextWhat = $("nextWhat");
  const logoutBtn = $("logoutBtn"), loginBtn = $("loginBtn"), currentUserText = $("currentUserText");
  const tabs = $("tabs"), addPanel = $("addPanel"), listPanel = $("listPanel");

  // --- AUTH & LOADING ---

  // check if user logged in, and decide where to load data from. 
  async function checkUser() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    currentUser = user || null;
    refreshTopbar(currentUser);

    if (currentUser) {
      await fetchSubs();
    } else {
      loadGuestSubs();
    }
  }
  // If user logged in -- load data from supabase
  async function fetchSubs() {
    const { data, error } = await supabaseClient
      .from('subscriptions')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('renewal', { ascending: true });

    if (error) console.error(error);
    else {
      subs = data;
      render();
    }
  }

  // Load guest data from local storage. 
  function loadGuestSubs() {
  try {
    subs = JSON.parse(localStorage.getItem(GUEST_STORAGE_KEY) || "[]");
  } catch {
    subs = [];
  }
  render();
  }

function saveGuestSubs() {
  localStorage.setItem(GUEST_STORAGE_KEY, JSON.stringify(subs));
}

function makeGuestId() {
  return Date.now().toString() + Math.random().toString(16).slice(2);
}

  // --- LOGIC HELPERS ---

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  if (!dateInput.value) dateInput.value = todayISO();

  function parseDate(iso) {
    const p = (iso || "").split("-").map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }

  function daysLeft(iso) {
    const today = new Date();
    const a = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const d = parseDate(iso);
    const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.ceil((b - a) / (1000 * 60 * 60 * 24));
  }

  function bucketColor(days) {
    if (days <= 7) return "soon";
    if (days <= 30) return "mid";
    return "good";
  }

  function money(n) { return Number(n || 0).toLocaleString(undefined, { style: "currency", currency: "USD" }); }
  function pretty(d) { return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }

  function monthlyEstimate(price, cycle) {
    price = Number(price || 0);
    if (cycle === "yearly") return price / 12;
    if (cycle === "weekly") return (price * 52) / 12;
    return price;
  }

  function favicon(site) {
    if (!site) return "";
    let host = site.trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "");
    return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
  }

  // --- UI RENDERING ---

  function updateSummary() {
    const total = subs.reduce((sum, s) => sum + monthlyEstimate(s.price, s.cycle), 0);
    monthlyTotal.textContent = money(total);
    countText.textContent = subs.length + " subscription" + (subs.length === 1 ? "" : "s");
    if (!subs.length) { nextWhen.textContent = "—"; nextWhat.textContent = "—"; return; }
    const soonest = [...subs].sort((a, b) => parseDate(a.renewal) - parseDate(b.renewal))[0];
    const d = parseDate(soonest.renewal);
    const left = daysLeft(soonest.renewal);
    nextWhen.textContent = pretty(d);
    nextWhat.textContent = soonest.name + " • " + left + " days left";
  }

  function getView() {
    const q = (searchInput.value || "").trim().toLowerCase();

    let view = subs.filter(s => {
      const hay = (s.name + " " + (s.category || "") + " " + (s.site || "")).toLowerCase();
      if (q && !hay.includes(q)) return false;

      const d = daysLeft(s.renewal);
      const b = bucketColor(d);

      if (filterInput.value === "soon" && b !== "soon") return false;
      if (filterInput.value === "mid" && b !== "mid") return false;
      if (filterInput.value === "long" && b !== "good") return false;

      return true;
    });

    view.sort((a, b) => {
      const aDue = parseDate(a.renewal).getTime();
      const bDue = parseDate(b.renewal).getTime();

      switch (sortInput.value) {
        case "soonest": return aDue - bDue;
        case "latest":  return bDue - aDue;
        case "hi":      return Number(b.price) - Number(a.price);
        case "lo":      return Number(a.price) - Number(b.price);
        case "az":      return a.name.localeCompare(b.name);
        case "za":      return b.name.localeCompare(a.name);
      }
      return 0;
    });

  return view;
}

  function render() {
    updateSummary();
    const view = getView();

    if (!view.length) {
      listEl.innerHTML = `<div class="empty">Nothing here yet. Add one on the left.</div>`;
      return;
    }

    listEl.innerHTML = "";

    view.forEach(s => {
      const left = daysLeft(s.renewal);
      const b = bucketColor(left);
      const d = parseDate(s.renewal);

      const logo = s.site
        ? `<img src="${favicon(s.site)}" alt="" onerror="this.style.display='none'">`
        : "•";

      const div = document.createElement("div");
      div.className = "item " + b;

      div.innerHTML = `
        <div class="bar"></div>
        <div class="left">
          <div class="logo" title="${s.site || "No site"}">${logo}</div>
          <div style="min-width:0">
            <div class="name">${s.name}</div>
            <div class="meta">
              <span class="tag">${s.category || "Other"}</span>
              <span class="tag">${s.cycle}</span>
              <span class="tag">Due: ${pretty(d)}</span>
              <span class="tag">${left}d</span>
            </div>
            ${s.notes ? `<div class="note">${s.notes}</div>` : ""}
          </div>
        </div>
        <div class="right">
          <div class="price">${money(s.price)}</div>
          <div>
            <button class="small" data-action="edit" data-id="${s.id}">Edit</button>
            <button class="small danger" data-action="del" data-id="${s.id}">Delete</button>
          </div>
        </div>
      `;

      listEl.appendChild(div);
    });
}

  // --- EVENT LISTENERS ---

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();

    const obj = {
      name: nameInput.value,
      site: siteInput.value,
      price: Number(priceInput.value),
      cycle: cycleInput.value,
      renewal: dateInput.value,
      category: catInput.value,
      notes: notesInput.value
    };

    if (currentUser) {
      obj.user_id = currentUser.id;

      let error = null;

      if (editId) {
        const result = await supabaseClient
          .from('subscriptions')
          .update(obj)
          .eq('id', editId);

        error = result.error;
        editId = null;
        addBtn.textContent = "Add";
  } else {
    const result = await supabaseClient
      .from('subscriptions')
      .insert([obj]);

    error = result.error;
  }

  if (error) {
    console.error("Supabase error:", error);
    alert(error.message);
    return;
  }

  await fetchSubs();
} else {
      if (editId) {
        subs = subs.map(s => s.id == editId ? { ...s, ...obj, id: editId } : s);
        editId = null;
        addBtn.textContent = "Add";
      } else {
        subs.push({ ...obj, id: makeGuestId() });
      }

      saveGuestSubs();
      render();
    }

    formEl.reset();
    dateInput.value = todayISO();
  });

  listEl.addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;

    const id = btn.dataset.id;
    const action = btn.dataset.action;

    if (action === "del" && confirm("Delete?")) {
      if (currentUser) {
        await supabaseClient.from('subscriptions').delete().eq('id', id);
        await fetchSubs();
      } else {
        subs = subs.filter(x => x.id != id);
        saveGuestSubs();
        render();
      }
    } else if (action === "edit") {
      const hit = subs.find(x => x.id == id);
      if (!hit) return;

      editId = id;
      nameInput.value = hit.name || "";
      siteInput.value = hit.site || "";
      priceInput.value = hit.price ?? "";
      cycleInput.value = hit.cycle || "monthly";
      dateInput.value = hit.renewal || "";
      catInput.value = hit.category || "Other";
      notesInput.value = hit.notes || "";
      addBtn.textContent = "Save";
    }
  });

  resetBtn.addEventListener("click", () => {
    editId = null;
    addBtn.textContent = "Add";
    formEl.reset();
    dateInput.value = todayISO();
  });

  [searchInput, sortInput, filterInput].forEach(el => {
  el.addEventListener("input", render);
  el.addEventListener("change", render);
  });

  logoutBtn.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();

    currentUser = null;
    editId = null;

    formEl.reset();
    addBtn.textContent = "Add";

    refreshTopbar(null);
    loadGuestSubs();
  });

  loginBtn.addEventListener("click", () => {
    window.location.href = "login_screen.html";
  });

  function refreshTopbar(user) {
  if (user) {
    const displayName =
      user.user_metadata?.first_name && user.user_metadata?.last_name
        ? `${user.user_metadata.first_name} ${user.user_metadata.last_name}`
        : (user.email || "User");

    currentUserText.textContent = displayName;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    currentUserText.textContent = "Guest mode";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
  }
}

  checkUser(); // Kick off the process
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home | SubTracked</title>
  <link rel="icon" type="image/x-icon" href="images/subtracked_logo_small.PNG">
  <link rel="stylesheet" href="css/index.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand_area">
        <div class="brand_row">
          <img src="images/subtracked_logo_small.PNG" alt="Logo" class="main_logo">
          <h1>SubTracked</h1>
        </div>
        <div class="subtxt"></div>
      </div>

      <div class="user_area">
        <span id="currentUserText" class="current_user_text"></span>
        <button id="settingsBtn" class="iconBtn" title="settings">⚙</button>
        <button id="logoutBtn" class="small" type="button">Logout</button>       
        <button id="loginBtn" class="small" type="button">Login</button>
        
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="add">Add</button>
      <button class="tab" data-tab="list">List</button>
    </div>

    <div class="grid">
      <div class="card" id="addPanel">
        <div class="hd">
          <h2>Add subscription</h2>
        </div>

        <div class="bd">
          <form id="form">
            <div class="form-grid">
              <div>
                <label>Service</label>
                <input id="nameInput" placeholder="Spotify, Canva, Xbox..." required>
              </div>
              <div>
                <label>Website (logo)</label>
                <input id="siteInput" placeholder="spotify.com">
              </div>
              <div>
                <label>Price</label>
                <input id="priceInput" type="number" step="0.01" min="0" placeholder="9.99" required>
              </div>
              <div>
                <label>Cycle</label>
                <select id="cycleInput">
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                  <option value="weekly">Weekly</option>
                </select>
              </div>
              <div>
                <label>Next renewal</label>
                <input id="dateInput" type="date" required>
              </div>
              <div>
                <label>Category</label>
                <select id="catInput">
                  <option>Streaming</option>
                  <option>Music</option>
                  <option>Cloud</option>
                  <option>Gaming</option>
                  <option>Software</option>
                  <option>Fitness</option>
                  <option>Utilities</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div style="margin-top:10px">
              <label>Notes</label>
              <textarea id="notesInput" placeholder="shared account, student plan, cancel after semester..."></textarea>
            </div>

            <div class="btnrow">
              <button id="addBtn" type="submit">Add</button>
              <button class="secondary" id="resetBtn" type="button">Clear</button>
            </div>

            <div class="hint">
              Color is based on days left: 0–7 soon, 8–30 mid, 31+ long.
            </div>
          </form>
        </div>
      </div>

      <div class="card" id="listPanel">
        <div class="controls">
          <input id="searchInput" placeholder="Search...">
          <select id="sortInput">
            <option value="soonest">Due (soonest)</option>
            <option value="latest">Due (latest)</option>
            <option value="hi">Price (high)</option>
            <option value="lo">Price (low)</option>
            <option value="az">Name (A–Z)</option>
            <option value="za">Name (Z–A)</option>
          </select>
          <select id="filterInput">
            <option value="all">All</option>
            <option value="soon">Due soon</option>
            <option value="mid">Mid</option>
            <option value="long">Long-term</option>
          </select>
        </div>

        <div class="summary">
          <div class="box">
            <div class="k">Monthly total (estimated)</div>
            <div class="v" id="monthlyTotal">$0.00</div>
            <div class="s" id="countText">0 subscriptions</div>
          </div>
          <div class="box">
            <div class="k">Next renewal</div>
            <div class="v" id="nextWhen">—</div>
            <div class="s" id="nextWhat">—</div>
          </div>
        </div>

        <div class="list" id="list"></div>
      </div>
    </div>
  </div>
  <script src="js/index.js"></script>
</body>
</html>

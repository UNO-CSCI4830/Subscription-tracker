<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home | SubTracked</title>
  <link rel="icon" type="image/x-icon" href="subtracked_logo_small.PNG">

  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f1220;color:#f2f3f8}
    .wrap{max-width:1050px;margin:24px auto;padding:0 14px}
    h1{margin:0;font-size:22px}
    .subtxt{margin:6px 0 14px;color:#b9bdd0;font-size:13px}

    .tabs{display:none;gap:10px;margin-bottom:12px}
    .tab{
      flex:1;padding:10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);
      background:transparent;color:#b9bdd0;cursor:pointer;font-weight:700
    }
    .tab.active{background:#2b67ff;border-color:#2b67ff;color:#fff}

    .grid{display:grid;grid-template-columns:360px 1fr;gap:14px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:#141830;overflow:hidden}
    .hd{
      padding:12px 14px;display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,.10);background:#12162a
    }
    .hd h2{margin:0;font-size:14px}
    .bd{padding:14px}

    label{display:block;font-size:12px;color:#b9bdd0;margin:0 0 6px}
    input,select,textarea{
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.15);
      background: #0f1327;
      color: #f2f3f8;
      outline: none;
      box-sizing: border-box; 
      font-size: 13px;
    }
    textarea{min-height:70px;resize:vertical}

    .row{display:flex;gap:10px}
    .row>*{flex:1}

    .btnrow{display:flex;gap:10px;margin-top:12px}
    button{
      padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);
      background:#2b67ff;color:#fff;cursor:pointer;font-weight:700;font-size:13px
    }
    button.secondary{background:transparent;color:#f2f3f8}
    button.small{padding:7px 10px;font-size:12px;background:#1a1f39}
    button.danger{background:#ff476a;border-color:#ff476a}

    .hint{margin-top:10px;font-size:12px;color:#b9bdd0;line-height:1.35}

    .controls{
      display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.10);
      background:#12162a;flex-wrap:wrap
    }
    .controls input{flex:1;min-width:220px}

    .summary{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10)
    }
    .box{border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;background:#10142b}
    .box .k{font-size:12px;color:#b9bdd0;margin-bottom:6px}
    .box .v{font-size:18px;font-weight:800}
    .box .s{font-size:12px;color:#b9bdd0;margin-top:4px}

    .list{padding:12px 14px 14px}
    .empty{
      padding:14px;border:1px dashed rgba(255,255,255,.18);border-radius:12px;
      color:#b9bdd0;background:#10142b
    }

    .item{
      border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;margin-top:10px;
      background:#10142b;position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:10px
    }
    .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:#26d3b6}
    .soon .bar{background:#ff476a}
    .mid  .bar{background:#f5b942}
    .good .bar{background:#26d3b6}

    .left{display:flex;gap:10px;min-width:0;align-items:flex-start}
    .logo{
      width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
      background:#141830;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden
    }
    .logo img{width:18px;height:18px}
    .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
    .meta{margin-top:5px;font-size:12px;color:#b9bdd0;display:flex;flex-wrap:wrap;gap:8px}
    .tag{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 8px;background:#141830}
    .note{margin-top:6px;font-size:12px;color:#b9bdd0;line-height:1.3;max-width:560px}
    .right{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
    .price{font-weight:900}

    .form-grid {
      display: grid;
      /* Fixed 2-column layout with equal width */
      grid-template-columns: 1fr 1fr; 
      gap: 15px 10px; /* More vertical gap for labels */
    }

    /* Ensure the label and input stay stacked correctly */
    .form-grid > div {
      display: flex;
      flex-direction: column;
      min-width: 0; /* Prevents flex children from overflowing */
    }

    /* Ensure the label and input stay stacked correctly */
    .form-grid > div {
      display: flex;
      flex-direction: column;
      min-width: 0; /* Prevents flex children from overflowing */
    }
  </style>
</head>

<body>
  <div class="wrap">
    <img src="subtracked_logo_small.PNG" alt="Logo" style="float: left; margin-right: 10px; width: 50px; height: 50px; border-radius: 5px;">
    <h1>SubTracked</h1>
    <div class="subtxt">
      
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="add">Add</button>
      <button class="tab" data-tab="list">List</button>
    </div>

    <div class="grid">
      <div class="card" id="addPanel">
        <div class="hd">
          <h2>Add subscription</h2>
        </div>

        <div class="bd">
          <form id="form">
            <div class="form-grid">
              <div>
                <label>Service</label>
                <input id="nameInput" placeholder="Spotify, Canva, Xbox..." required>
              </div>
              <div>
                <label>Website (logo)</label>
                <input id="siteInput" placeholder="spotify.com">
              </div>
              <div>
                <label>Price</label>
                <input id="priceInput" type="number" step="0.01" min="0" placeholder="9.99" required>
              </div>
              <div>
                <label>Cycle</label>
                <select id="cycleInput">
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                  <option value="weekly">Weekly</option>
                </select>
              </div>
              <div>
                <label>Next renewal</label>
                <input id="dateInput" type="date" required>
              </div>
              <div>
                <label>Category</label>
                <select id="catInput">
                  <option>Streaming</option>
                  <option>Music</option>
                  <option>Cloud</option>
                  <option>Gaming</option>
                  <option>Software</option>
                  <option>Fitness</option>
                  <option>Utilities</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div style="margin-top:10px">
              <label>Notes</label>
              <textarea id="notesInput" placeholder="shared account, student plan, cancel after semester..."></textarea>
            </div>

            <div class="btnrow">
              <button id="addBtn" type="submit">Add</button>
              <button class="secondary" id="resetBtn" type="button">Clear</button>
            </div>

            <div class="hint">
              Color is based on days left: 0–7 soon, 8–30 mid, 31+ long.
            </div>
          </form>
        </div>
      </div>

      <div class="card" id="listPanel">
        <div class="controls">
          <input id="searchInput" placeholder="Search...">
          <select id="sortInput">
            <option value="soonest">Due (soonest)</option>
            <option value="latest">Due (latest)</option>
            <option value="hi">Price (high)</option>
            <option value="lo">Price (low)</option>
            <option value="az">Name (A–Z)</option>
            <option value="za">Name (Z–A)</option>
          </select>
          <select id="filterInput">
            <option value="all">All</option>
            <option value="soon">Due soon</option>
            <option value="mid">Mid</option>
            <option value="long">Long-term</option>
          </select>
        </div>

        <div class="summary">
          <div class="box">
            <div class="k">Monthly total (estimated)</div>
            <div class="v" id="monthlyTotal">$0.00</div>
            <div class="s" id="countText">0 subscriptions</div>
          </div>
          <div class="box">
            <div class="k">Next renewal</div>
            <div class="v" id="nextWhen">—</div>
            <div class="s" id="nextWhat">—</div>
          </div>
        </div>

        <div class="list" id="list"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>



</body>
</html>

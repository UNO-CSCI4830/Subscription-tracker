<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | SubTracked</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/x-icon" href="images/subtracked_logo_small.PNG">
  <link rel="stylesheet" href="css/login_screen.css">

</head>
<body>

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <img src="images/subtracked_logo.PNG" alt="Logo" style="width: 250px; height: auto; border-radius: 10px;">
  </div>

  <div class="login-card">
    <div class="hd">
      <h1>Welcome Back!</h1>
    </div>

    <div class="bd">
      <form id="loginForm">
        <div class="field">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="name@company.com" required>
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Sign In</button>
      </form>

      <div class="footer-txt">
        Don't have an account? <a href="create_account.html">Create one</a>
      </div>
    </div>
  </div>
  <script src="js/login_screen.js"></script>
</body>
</html>

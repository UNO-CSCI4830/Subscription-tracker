<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subscription Tracker</title>

  <style>
    body {
      font-family: sans-serif;
      color: #333333;
      background: #fff;
    }

    .demo, .noedit {
      font-family: monospace;
      font-size  : 14px;
      padding    : 2px;
      margin     : 0px;
      border: 1px solid #ccc;
      display    : inline-block;
      border-radius: 3px;
    }

    .demoInput { background-color: rgb(255, 255, 244); }
    .demoOutput{ background-color: rgb(172, 243, 172); }
    .demoError { background-color: rgb(248, 151, 151); }
    .demoNull  { background-color: rgb(224, 203, 149); }

    .demoIO, .noedit {
      border: 1px solid #ccc;
      border-radius: 3px;
      display: inline-block;
      padding: 8px;
      background-color: #f8f8f8;
    }

    .noedit { display: block; }

    .markdown {
      display: inline-block;
      background: #fff;
      border-radius: 3px;
      font-size: 14px;
      line-height: 1.6;
      font: 13px Helvetica, arial, freesans, clean, sans-serif;
      border: 1px solid #CACACA;
      margin: 0px auto auto;
      padding: 0px 30px 20px 30px;
      text-align: left;
      min-width: 760px;
    }

    .markdown p { max-width: 700px; }

    #centerer {
      text-align: center;
      padding: 0px;
      margin: 0px;
    }

    .markdown>h2, .markdown>h3,
    .markdown>h4, .markdown>h5, .markdown>h6 {
      border-bottom: 1px solid #ccc;
    }

    .container {
      padding: 3px;
      background: #EEE;
      border-radius: 3px;
      margin: 0px;
      display: inline-block;
      margin-bottom: 200px;
    }

    #footer {
      font-size: 10px;
      text-align: center;
      color: #777;
      margin-top: 30px;
    }

    /* little helpers */
    .tiny {
      font-family: monospace;
      font-size: 12px;
      color: #666;
    }

    .pill {
      font-family: monospace;
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      display: inline-block;
      margin-right: 6px;
      margin-top: 5px;
    }

    .subBox {
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      padding: 8px;
      margin-top: 8px;
      max-width: 780px;
    }

    .btn {
      font-family: monospace;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid #aaa;
      border-radius: 3px;
      background: #f3f3f3;
      cursor: pointer;
      margin-right: 6px;
    }
    .btn:hover { background: #eaeaea; }

    .btnBad {
      border-color: #c77;
      background: #fbe3e3;
    }

    input, select, textarea {
      font-family: monospace;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: rgb(255, 255, 244);
      box-sizing: border-box;
    }

    textarea {
      width: 720px;
      min-height: 60px;
      resize: vertical;
    }

    .rowish { margin: 8px 0px; }

    /* quick “urgency” tint */
    .soonTint { background: rgb(248, 151, 151); }
    .midTint  { background: rgb(224, 203, 149); }
    .goodTint { background: rgb(172, 243, 172); }

    /* favicon bit */
    .iconBox {
      display:inline-block;
      width: 22px;
      height: 22px;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: #fff;
      vertical-align: middle;
      margin-right: 8px;
      overflow: hidden;
    }
    .iconBox img {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      margin-left: 2px;
      display: block;
    }

    @media (max-width: 860px) {
      .markdown { min-width: auto; width: 92vw; }
      textarea  { width: 92vw; }
    }
  </style>
</head>

<body>
  <div id=centerer>
    <div class=container><div class=markdown>

      <h1>Subscription Tracker</h1>

      <h2>Add</h2>

      <div class="demoIO" style="max-width:820px;">
        <div class="rowish">
          <div class="tiny">service</div><br>
          <input id="svcNameBox" placeholder="Spotify, Xbox, Canva..." style="width:340px;">
        </div>

        <div class="rowish">
          <div class="tiny">site (optional)</div><br>
          <input id="siteBox" placeholder="spotify.com" style="width:340px;">
        </div>

        <div class="rowish">
          <div style="display:inline-block;margin-right:10px;">
            <div class="tiny">price</div><br>
            <input id="priceBox" type="number" step="0.01" min="0" placeholder="9.99" style="width:160px;">
          </div>

          <div style="display:inline-block;margin-right:10px;">
            <div class="tiny">cycle</div><br>
            <select id="cycleBox" style="width:160px;">
              <option value="monthly">monthly</option>
              <option value="yearly">yearly</option>
              <option value="weekly">weekly</option>
            </select>
          </div>
        </div>

        <div class="rowish">
          <div style="display:inline-block;margin-right:10px;">
            <div class="tiny">next renewal (click it)</div><br>
            <input id="dateBox" type="date" style="width:220px;">
          </div>

          <div style="display:inline-block;">
            <div class="tiny">category</div><br>
            <select id="catBox" style="width:220px;">
              <option>Streaming</option>
              <option>Music</option>
              <option>Cloud</option>
              <option>Gaming</option>
              <option>Software</option>
              <option>Fitness</option>
              <option>Utilities</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="rowish">
          <div class="tiny">notes</div><br>
          <textarea id="notesBox" placeholder="shared account, student plan, cancel later..."></textarea>
        </div>

        <div class="rowish">
          <button class="btn" id="btnAddOrSave">Add</button>
          <button class="btn" id="btnClear">Clear</button>
          <button class="btn" id="btnDemo">Load demo</button>
          <span class="tiny" id="editModeText" style="margin-left:8px;"></span>
        </div>

        <div class="tiny">colors: 0-7 = soon, 8-30 = mid, 31+ = good</div>
      </div>

      <h2>List</h2>

      <div class="demoIO" style="max-width:820px;">
        <div class="rowish">
          <div style="display:inline-block;margin-right:10px;">
            <div class="tiny">search</div><br>
            <input id="searchBox" placeholder="search..." style="width:260px;">
          </div>

          <div style="display:inline-block;margin-right:10px;">
            <div class="tiny">sort</div><br>
            <select id="sortBox" style="width:180px;">
              <option value="soonest">due soonest</option>
              <option value="latest">due latest</option>
              <option value="hi">price high</option>
              <option value="lo">price low</option>
              <option value="az">name a-z</option>
              <option value="za">name z-a</option>
            </select>
          </div>

          <div style="display:inline-block;">
            <div class="tiny">filter</div><br>
            <select id="filterBox" style="width:160px;">
              <option value="all">all</option>
              <option value="soon">due soon</option>
              <option value="mid">mid</option>
              <option value="long">long-term</option>
            </select>
          </div>
        </div>

        <div class="rowish">
          <span class="pill">monthly total: <span id="monthlyOut">$0.00</span></span>
          <span class="pill"><span id="countOut">0 subscriptions</span></span>
          <span class="pill">next: <span id="nextOut">—</span></span>
        </div>

        <div id="listArea"></div>
      </div>

    </div></div>
  </div>

  <div id=footer>
    saved using localStorage • single file • no frameworks
  </div>

  <script>
    // ok so this is just a lil tracker
    // saves to localStorage so refresh doesn't kill it

    var SAVE_KEY_THING = "max_sub_tracker_v3";
    var mySubsList = [];
    var whoAmIEditing = null;

    function g(id){ return document.getElementById(id); }

    var svcNameBox = g("svcNameBox");
    var siteBox    = g("siteBox");
    var priceBox   = g("priceBox");
    var cycleBox   = g("cycleBox");
    var dateBox    = g("dateBox");
    var catBox     = g("catBox");
    var notesBox   = g("notesBox");

    var btnAddOrSave = g("btnAddOrSave");
    var btnClear     = g("btnClear");
    var btnDemo      = g("btnDemo");

    var searchBox = g("searchBox");
    var sortBox   = g("sortBox");
    var filterBox = g("filterBox");

    var monthlyOut = g("monthlyOut");
    var countOut   = g("countOut");
    var nextOut    = g("nextOut");

    var listArea = g("listArea");
    var editModeText = g("editModeText");

    function todayISO(){
      return new Date().toISOString().slice(0,10);
    }

    if(!dateBox.value) dateBox.value = todayISO();

    function loadMyStuff(){
      try {
        var raw = localStorage.getItem(SAVE_KEY_THING);
        mySubsList = raw ? JSON.parse(raw) : [];
        if(!Array.isArray(mySubsList)) mySubsList = [];
      } catch(err) {
        mySubsList = [];
      }
    }

    function saveMyStuff(){
      try { localStorage.setItem(SAVE_KEY_THING, JSON.stringify(mySubsList)); }
      catch(err) {}
    }

    function makeIdThing(){
      return Math.random().toString(16).slice(2) + Date.now().toString(16);
    }

    function parseIsoDate(iso){
      var p = (iso || "").split("-").map(Number);
      return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
    }

    function daysTil(iso){
      var t = new Date();
      var a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      var d = parseIsoDate(iso);
      var b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return Math.ceil((b - a) / (1000*60*60*24));
    }

    function money(n){
      return Number(n || 0).toLocaleString(undefined, { style:"currency", currency:"USD" });
    }

    function prettyDate(d){
      return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
    }

    function estMonthly(price, cycle){
      price = Number(price || 0);
      if(cycle === "yearly") return price / 12;
      if(cycle === "weekly") return (price * 52) / 12;
      return price;
    }

    function urgencyClass(days){
      if(days <= 7) return "soonTint";
      if(days <= 30) return "midTint";
      return "goodTint";
    }

    function escapeHtml(x){
      return String(x ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function faviconFor(site){
      // tries google favicon service
      if(!site) return "";
      var host = site.trim().replace(/^https?:\/\//i, "");
      host = host.replace(/\/.*$/, "");
      if(!host) return "";
      return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(host) + "&sz=64";
    }

    function updateTopBits(){
      var total = 0;
      for(var i=0;i<mySubsList.length;i++){
        total += estMonthly(mySubsList[i].price, mySubsList[i].cycle);
      }
      monthlyOut.textContent = money(total);
      countOut.textContent = mySubsList.length + " subscription" + (mySubsList.length===1?"":"s");

      if(!mySubsList.length){
        nextOut.textContent = "—";
        return;
      }

      var soonest = mySubsList.slice().sort(function(a,b){
        return parseIsoDate(a.renewal) - parseIsoDate(b.renewal);
      })[0];

      var left = daysTil(soonest.renewal);
      nextOut.textContent = soonest.name + " (" + left + "d) " + prettyDate(parseIsoDate(soonest.renewal));
    }

    function viewListNow(){
      var q = (searchBox.value || "").trim().toLowerCase();

      var view = mySubsList.filter(function(s){
        var hay = (s.name + " " + (s.category||"") + " " + (s.site||"")).toLowerCase();
        if(q && hay.indexOf(q) === -1) return false;

        var b = (daysTil(s.renewal) <= 7) ? "soon" : (daysTil(s.renewal) <= 30 ? "mid" : "good");

        if(filterBox.value === "soon" && b !== "soon") return false;
        if(filterBox.value === "mid"  && b !== "mid")  return false;
        if(filterBox.value === "long" && b !== "good") return false;

        return true;
      });

      view.sort(function(a,b){
        var aDue = parseIsoDate(a.renewal).getTime();
        var bDue = parseIsoDate(b.renewal).getTime();

        switch(sortBox.value){
          case "soonest": return aDue - bDue;
          case "latest":  return bDue - aDue;
          case "hi":      return Number(b.price) - Number(a.price);
          case "lo":      return Number(a.price) - Number(b.price);
          case "az":      return a.name.localeCompare(b.name);
          case "za":      return b.name.localeCompare(a.name);
        }
        return 0;
      });

      return view;
    }

    function paintTheList(){
      updateTopBits();

      var view = viewListNow();
      if(!view.length){
        listArea.innerHTML = "<div class='tiny'>nothing yet. add one above (or demo).</div>";
        return;
      }

      listArea.innerHTML = "";

      view.forEach(function(s){
        var left = daysTil(s.renewal);
        var tint = urgencyClass(left);

        var icon = "";
        if(s.site){
          var u = faviconFor(s.site);
          if(u){
            icon = "<span class='iconBox'><img src='" + u + "' alt='' onerror='this.parentElement.style.display=\"none\"'></span>";
          }
        }
        if(!icon) icon = "<span class='iconBox'><img src='' alt='' style='display:none;'></span>";

        var div = document.createElement("div");
        div.className = "subBox " + tint;

        div.innerHTML =
          "<div style='display:flex;justify-content:space-between;gap:10px;align-items:flex-start;'>" +
            "<div>" +
              "<div style='font-family:monospace;font-weight:700;font-size:15px;'>" +
                icon + escapeHtml(s.name) +
              "</div>" +
              "<div class='tiny'>" +
                escapeHtml(s.category || "Other") + " • " + escapeHtml(s.cycle) + " • due " +
                escapeHtml(prettyDate(parseIsoDate(s.renewal))) + " • " + left + "d" +
              "</div>" +
              (s.site ? "<div class='tiny'>site: " + escapeHtml(s.site) + "</div>" : "") +
              (s.notes ? "<div style='font-family:monospace;font-size:12px;margin-top:6px;white-space:pre-wrap;'>" + escapeHtml(s.notes) + "</div>" : "") +
            "</div>" +

            "<div style='text-align:right;min-width:170px;font-family:monospace;'>" +
              "<div style='font-weight:700;'>" + money(s.price) + "</div>" +
              "<div style='margin-top:6px;'>" +
                "<button class='btn' data-act='edit' data-id='" + s.id + "'>edit</button>" +
                "<button class='btn btnBad' data-act='del' data-id='" + s.id + "'>delete</button>" +
              "</div>" +
            "</div>" +
          "</div>";

        listArea.appendChild(div);
      });
    }

    function clearInputsNow(){
      whoAmIEditing = null;
      btnAddOrSave.textContent = "Add";
      editModeText.textContent = "";

      svcNameBox.value = "";
      siteBox.value = "";
      priceBox.value = "";
      cycleBox.value = "monthly";
      catBox.value = "Streaming";
      notesBox.value = "";

      dateBox.value = todayISO();
    }

    btnAddOrSave.addEventListener("click", function(){
      var name = svcNameBox.value.trim();
      var site = siteBox.value.trim();
      var price = priceBox.value;
      var cycle = cycleBox.value;
      var renewal = dateBox.value;
      var category = catBox.value;
      var notes = notesBox.value.trim();

      if(!name || price === "" || !renewal){
        alert("need name + price + date");
        return;
      }

      var obj = {
        id: whoAmIEditing || makeIdThing(),
        name: name,
        site: site,
        price: Number(price),
        cycle: cycle,
        renewal: renewal,
        category: category,
        notes: notes
      };

      if(whoAmIEditing){
        var idx = mySubsList.findIndex(function(x){ return x.id === whoAmIEditing; });
        if(idx !== -1) mySubsList[idx] = obj;
        whoAmIEditing = null;
        btnAddOrSave.textContent = "Add";
        editModeText.textContent = "";
      } else {
        mySubsList.push(obj);
      }

      saveMyStuff();
      paintTheList();
      clearInputsNow();
    });

    btnClear.addEventListener("click", function(){
      clearInputsNow();
    });

    btnDemo.addEventListener("click", function(){
      function plus(n){
        var d = new Date();
        d.setDate(d.getDate() + n);
        return d.toISOString().slice(0,10);
      }

      mySubsList = [
        { id: makeIdThing(), name:"Xbox Game Pass", site:"xbox.com", price:16.99, cycle:"monthly", renewal:plus(5),  category:"Gaming",   notes:"forget to cancel sometimes" },
        { id: makeIdThing(), name:"Canva Pro",      site:"canva.com",price:12.99, cycle:"monthly", renewal:plus(14), category:"Software", notes:"using for class stuff" },
        { id: makeIdThing(), name:"iCloud",         site:"icloud.com",price:2.99, cycle:"monthly", renewal:plus(38), category:"Cloud",    notes:"phone backups" },
        { id: makeIdThing(), name:"Amazon Prime",   site:"amazon.com",price:139,  cycle:"yearly",  renewal:plus(9),  category:"Utilities",notes:"yearly" }
      ];

      saveMyStuff();
      paintTheList();
    });

    listArea.addEventListener("click", function(e){
      var btn = e.target.closest("button");
      if(!btn) return;

      var act = btn.getAttribute("data-act");
      var id  = btn.getAttribute("data-id");

      var hit = mySubsList.find(function(x){ return x.id === id; });
      if(!hit) return;

      if(act === "del"){
        if(confirm("delete " + hit.name + "?")){
          mySubsList = mySubsList.filter(function(x){ return x.id !== id; });
          saveMyStuff();
          paintTheList();
        }
      }

      if(act === "edit"){
        whoAmIEditing = id;
        btnAddOrSave.textContent = "Save";
        editModeText.textContent = "(editing " + hit.name + ")";

        svcNameBox.value = hit.name || "";
        siteBox.value = hit.site || "";
        priceBox.value = hit.price ?? "";
        cycleBox.value = hit.cycle || "monthly";
        dateBox.value = hit.renewal || todayISO();
        catBox.value = hit.category || "Other";
        notesBox.value = hit.notes || "";
      }
    });

    [searchBox, sortBox, filterBox].forEach(function(el){
      el.addEventListener("input", paintTheList);
      el.addEventListener("change", paintTheList);
    });

    loadMyStuff();
    paintTheList();
  </script>
</body>
</html>
